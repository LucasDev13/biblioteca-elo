name: Deploy to Production biblioteca-elo

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  create-pull-request:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if PR exists
        id: pr_check
        run: |
          PR_NUMBER=$(gh pr list --base production --head develop --json number -q ".[0].number")
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR exists. Proceeding to create a new one."
            echo "pr_exists=false" >> $GITHUB_ENV
          else
            echo "PR exists with number $PR_NUMBER"
            echo "pr_exists=true" >> $GITHUB_ENV
            echo "pr_number=$PR_NUMBER" >> $GITHUB_ENV
          fi

      - name: Create Pull Request to Production
        if: env.pr_exists == 'false'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: develop
          destination_branch: production
          pr_title: "Auto PR from develop to production"
          pr_body: "This pull request was automatically generated."
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Approve and Merge Pull Request
        if: env.pr_exists == 'true'
        run: |
          gh pr review ${{ env.pr_number }} --approve --body "Auto-approval by GitHub Actions."
          gh pr merge ${{ env.pr_number }} --merge --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}